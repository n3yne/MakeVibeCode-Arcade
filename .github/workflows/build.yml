# ─────────────────────────────────────────────────────────────────────────────
# Builds MakeVibeCode Arcade for all 5 platforms and uploads artifacts.
#
# Triggers: creating a GitHub Release | manual "Run workflow"
# (Plain pushes to main no longer trigger a build — this is a 5-platform build,
# so it only runs when you're actually cutting a release, or on demand.)
#
# ── Secrets for signed iOS IPA ───────────────────────────────────────────────
#   IOS_CERTIFICATE_P12          Base64-encoded distribution cert (.p12)
#     How: Keychain Access → export your Apple distribution cert → base64 encode
#     macOS: base64 -i cert.p12 | pbcopy
#   IOS_CERTIFICATE_PASSWORD     Password chosen when exporting the .p12
#   IOS_PROVISIONING_PROFILE     Base64-encoded provisioning profile (.mobileprovision)
#     How: developer.apple.com → Certificates, IDs & Profiles → Profiles → Download
#     macOS: base64 -i profile.mobileprovision | pbcopy
#   IOS_TEAM_ID                  10-char Apple Developer Team ID
#     How: developer.apple.com → Account → Membership Details
#
#   Without these four secrets, the iOS job still runs but produces a
#   simulator-only build to verify the pipeline compiles successfully.
#
# ── Secrets to also auto-upload the IPA to TestFlight ────────────────────────
#   (Requires the four IOS_* secrets above to be set — this uploads the same
#   signed IPA to App Store Connect via an App Store Connect API key.)
#   APP_STORE_CONNECT_ISSUER_ID   App Store Connect → Users and Access → Integrations
#                                 → Keys tab — the "Issuer ID" shown at the top (a UUID)
#   APP_STORE_CONNECT_KEY_ID      Same Keys tab → the Key ID column for your API key
#   APP_STORE_CONNECT_API_KEY     The full contents of the downloaded AuthKey_XXXX.p8
#                                 file, pasted as-is (multi-line PEM text, no encoding
#                                 needed — GitHub secrets support multi-line values)
#     How to create the key: App Store Connect → Users and Access → Integrations →
#     Keys tab → Generate API Key → Access: "App Manager" or higher → Download
#     (the .p8 can only be downloaded once — save it somewhere safe)
#
#   Without these three secrets, the IPA still builds and is signed, but is
#   only uploaded as a GitHub Actions artifact — you'd upload it to App
#   Store Connect manually (e.g. via Transporter.app).
#
# ── Optional secrets for signed desktop builds ───────────────────────────────
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD   Windows EV/OV certificate (.pfx, base64)
#   CSC_LINK / CSC_KEY_PASSWORD           macOS Developer certificate (.p12, base64)
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   for notarization
# ─────────────────────────────────────────────────────────────────────────────
name: Build All Platforms

on:
  release:
    types: [created]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  # ── Windows (.exe installer + portable) ─────────────────────────────────────
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # See the macOS job for why empty-but-set CSC_LINK is avoided.
      - name: Configure Windows signing env (optional)
        shell: bash
        run: |
          if [ -n "${{ secrets.WIN_CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.WIN_CSC_LINK }}" >> $GITHUB_ENV
            echo "CSC_KEY_PASSWORD=${{ secrets.WIN_CSC_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> $GITHUB_ENV
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV
          fi

      - name: Build Windows installer and portable
        run: npm run dist:win -- --publish=never

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.blockmap

  # ── macOS (universal DMG for Intel + Apple Silicon) ──────────────────────────
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # electron-builder treats an empty-but-set CSC_LINK as "load a cert file here"
      # and fails trying to read the repo root as a file. Only set signing env vars
      # when the secrets actually have values; otherwise stay fully unsigned.
      - name: Configure macOS signing env (optional)
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.CSC_LINK }}" >> $GITHUB_ENV
            echo "CSC_KEY_PASSWORD=${{ secrets.CSC_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> $GITHUB_ENV
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV
          fi
          if [ -n "${{ secrets.APPLE_ID }}" ]; then
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV
          fi

      - name: Build macOS DMG
        run: npm run dist:mac -- --publish=never

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg

  # ── Linux (AppImage + .deb) ──────────────────────────────────────────────────
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build Linux packages
        run: npm run dist:linux -- --publish=never

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb

  # ── Android (debug APK) ──────────────────────────────────────────────────────
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - run: npm ci

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: android/app/build/outputs/apk/debug/*.apk

  # ── iOS (simulator build always; signed IPA when secrets are set) ────────────
  ios:
    name: iOS
    runs-on: macos-latest
    env:
      HAS_IOS_CERTS: ${{ secrets.IOS_CERTIFICATE_P12 != '' }}
      HAS_APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Cache the CocoaPods spec index (the slow part) keyed to Capacitor version
      - name: Cache CocoaPods spec index
        uses: actions/cache@v6
        with:
          path: ~/.cocoapods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: cocoapods-${{ runner.os }}-

      # Generates ios/ project and runs `pod install` automatically
      - name: Generate iOS project
        run: npx cap add ios

      # The MakeCodeBridge overlay WebView is inserted BEHIND the Capacitor
      # bridge's own WKWebView (see native-plugins/ios/MakeCodeBridgePlugin.swift
      # + native-plugins/README.md). For it to be visible at all, the bridge
      # WebView itself must be made transparent so renderer/styles.css's
      # transparent #arcade-container hole shows the overlay through it.
      # This has to be patched into the freshly generated AppDelegate.swift on
      # every build since ios/ isn't committed to the repo (see .gitignore).
      - name: Make bridge WebView transparent (for MakeCodeBridge overlay)
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("ios/App/App/AppDelegate.swift")
          src = p.read_text()
          old = "    func applicationDidBecomeActive(_ application: UIApplication) {\n"
          old += "        // Restart any tasks that were paused (or not yet started) while the application was inactive. If the application was previously in the background, optionally refresh the user interface.\n"
          old += "    }"
          new = "    func applicationDidBecomeActive(_ application: UIApplication) {\n"
          new += "        // Restart any tasks that were paused (or not yet started) while the application was inactive. If the application was previously in the background, optionally refresh the user interface.\n"
          new += "\n"
          new += "        // Make the bridge WebView transparent so MakeCodeBridge's native overlay\n"
          new += "        // WebView (inserted behind it) shows through the #arcade-container hole\n"
          new += "        // in renderer/styles.css. See native-plugins/README.md.\n"
          new += "        if let vc = window?.rootViewController as? CAPBridgeViewController, vc.webView?.isOpaque != false {\n"
          new += "            vc.webView?.isOpaque = false\n"
          new += "            vc.webView?.backgroundColor = .clear\n"
          new += "            vc.webView?.scrollView.backgroundColor = .clear\n"
          new += "            vc.view.backgroundColor = .clear\n"
          new += "        }\n"
          new += "    }"
          if old not in src:
              raise SystemExit(
                  "AppDelegate.swift didn't match the expected Capacitor template -- "
                  "it may have changed shape. Update the patch in build.yml."
              )
          p.write_text(src.replace(old, new, 1))
          print("Patched AppDelegate.swift for WebView transparency")
          PY

      # Copy the MakeCodeBridge native plugin sources into the new Xcode project
      - name: Copy MakeCodeBridge plugin sources
        run: |
          mkdir -p ios/App/App/Plugins/MakeCodeBridge
          cp native-plugins/ios/MakeCodeBridgePlugin.swift ios/App/App/Plugins/MakeCodeBridge/
          cp native-plugins/ios/MakeCodeBridgePlugin.m    ios/App/App/Plugins/MakeCodeBridge/

      # Add the copied files to the Xcode project so they get compiled
      - name: Register plugin files in Xcode project
        run: |
          gem install xcodeproj --no-document
          ruby .github/scripts/add_ios_plugin.rb

      # Capacitor 8 uses Swift Package Manager — no Podfile/workspace needed.
      # Fall back to pod install only if a Podfile is present (older setups).
      - name: Install CocoaPods dependencies (if Podfile present)
        run: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App && pod install --repo-update
          else
            echo "No Podfile found — project uses Swift Package Manager, skipping pod install"
          fi

      # Detect whether to use CocoaPods workspace or raw xcodeproj
      - name: Resolve Xcode project reference
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            echo "XCODE_REF=-workspace ios/App/App.xcworkspace" >> $GITHUB_ENV
            echo "Using CocoaPods workspace"
          else
            echo "XCODE_REF=-project ios/App/App.xcodeproj" >> $GITHUB_ENV
            echo "Using SPM project directly"
          fi
          echo "--- ios/App/ contents ---"
          ls -la ios/App/

      # ── Simulator build (unsigned — no secrets needed) ───────────────────────
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            $XCODE_REF \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package simulator app
        run: |
          mkdir -p artifacts
          APP=$(find ios/build/simulator/Build/Products -name "*.app" -maxdepth 4 -type d 2>/dev/null | head -1)
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            tar -czf artifacts/MakeVibeCode-Arcade-iOS-Simulator.tar.gz \
              -C "$(dirname "$APP")" "$(basename "$APP")"
            echo "Packaged: $APP"
          else
            echo "Warning: no .app found — listing build output:"
            find ios/build/simulator -name "*.app" 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator
          path: artifacts/MakeVibeCode-Arcade-iOS-Simulator.tar.gz
          if-no-files-found: warn

      # ── Signed IPA (only runs when IOS_CERTIFICATE_P12 secret is set) ─────────
      - name: Import signing certificate
        if: env.HAS_IOS_CERTS == 'true'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KC_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KC_PASS=$(openssl rand -hex 16)
          echo "KEYCHAIN_PATH=$KC_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KC_PASS" >> $GITHUB_ENV

          # Decode .p12 — echo -n avoids a trailing newline that can corrupt the decode
          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          # Informational only — the real gate is the find-identity count check below.
          # macOS p12s use RC2-40-CBC, which needs -legacy on OpenSSL 3.x but the flag
          # doesn't exist on LibreSSL (macOS system openssl), and runner images vary.
          echo "=== .p12 verification (informational) ==="
          openssl pkcs12 -legacy -in "$CERT_PATH" -passin pass:"$CERTIFICATE_PASSWORD" -nocerts -noout 2>/dev/null \
            || openssl pkcs12 -in "$CERT_PATH" -passin pass:"$CERTIFICATE_PASSWORD" -nocerts -noout 2>/dev/null \
            && echo "✓ Private key present in .p12" \
            || echo "⚠ openssl check inconclusive (flag/cipher mismatch) — deferring to security import below"

          # Create, configure, and unlock a temporary keychain
          security create-keychain -p "$KC_PASS" "$KC_PATH"
          security set-keychain-settings -lut 21600 "$KC_PATH"
          security unlock-keychain -p "$KC_PASS" "$KC_PATH"

          # Import certificate + private key, then allow access without interactive prompts
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC_PATH"

          # Replace keychain search list with ours so codesign finds it
          security list-keychain -d user -s "$KC_PATH"

          # Hard fail if no valid identity ended up in the keychain
          echo "=== Codesigning identities ==="
          security find-identity -v -p codesigning "$KC_PATH"
          COUNT=$(security find-identity -v -p codesigning "$KC_PATH" | grep -c "Apple Distribution\|iPhone Distribution" || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "✗ Certificate imported but no valid distribution identity found."
            echo "  The .p12 may have been exported from 'Certificates' instead of 'My Certificates'."
            exit 1
          fi
          echo "✓ $COUNT valid distribution identity/identities ready"

      - name: Install provisioning profile
        if: env.HAS_IOS_CERTS == 'true'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          # Extract UUID and Name — the export plist needs the Name, xcodebuild the UUID
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision \
            > /tmp/profile.plist
          PP_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          PP_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)
          echo "PROVISIONING_PROFILE_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "PROVISIONING_PROFILE_NAME=$PP_NAME" >> $GITHUB_ENV
          echo "Installed profile: $PP_NAME ($PP_UUID)"

      - name: Archive iOS app (signed)
        if: env.HAS_IOS_CERTS == 'true'
        run: |
          xcodebuild \
            $XCODE_REF \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build/App.xcarchive \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROVISIONING_PROFILE_UUID" \
            archive

      - name: Export IPA
        if: env.HAS_IOS_CERTS == 'true'
        run: |
          BUNDLE_ID=$(node -p "require('./capacitor.config.json').appId")
          cat > /tmp/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROVISIONING_PROFILE_NAME</string>
            </dict>
            <key>compileBitcode</key><false/>
            <key>uploadSymbols</key><false/>
          </dict></plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath ios/build/App.xcarchive \
            -exportPath ios/build/export \
            -exportOptionsPlist /tmp/ExportOptions.plist

      - uses: actions/upload-artifact@v7
        if: env.HAS_IOS_CERTS == 'true'
        with:
          name: ios-signed
          path: ios/build/export/*.ipa

      - name: Resolve exported IPA path
        if: env.HAS_IOS_CERTS == 'true' && env.HAS_APP_STORE_CONNECT_KEY == 'true'
        run: |
          IPA_PATH=$(find ios/build/export -maxdepth 1 -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "No .ipa found in ios/build/export"
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_ENV
          echo "Found: $IPA_PATH"

      # Uploads to App Store Connect via its API — the build then appears in
      # TestFlight (under Processing, then ready for testers) a few minutes later.
      # Requires an App Store Connect API key — see secrets docs at the top of this file.
      - name: Upload to TestFlight
        if: env.HAS_IOS_CERTS == 'true' && env.HAS_APP_STORE_CONNECT_KEY == 'true'
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.IPA_PATH }}
          app-type: ios
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

  # ── Attach all artifacts to the GitHub Release ───────────────────────────────
  release:
    name: Publish Release
    needs: [windows, macos, linux, android, ios]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**
